[package]
name = "lumen"
version = "2.0.0"
edition = "2021"
description = "Spotlight-style search launcher for Ubuntu / GNOME"

[[bin]]
name = "lumen"
path = "src/main.rs"

[[bin]]
name = "lumen-toggle"
path = "src/bin/lumen-toggle.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
serde_json = "1"
ureq = "2.12"
chrono = "0.4"
chrono-tz = "0.10"
async-channel = "2"
urlencoding = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
